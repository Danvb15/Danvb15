<svg width="540" height="210" viewBox="0 0 540 210" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="langTitleId">
  <title id="langTitleId">Lenguajes Más Usados (27 Repositorios Públicos + Privados)</title>
  <style>
