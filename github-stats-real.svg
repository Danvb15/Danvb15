<svg width="540" height="220" viewBox="0 0 540 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titleId">
  <title id="titleId">Daniel Vásquez (Danvb15) — Estadísticas Reales de GitHub</title>
  <style>
    .header { font: 700 16.5px 'Segoe UI', Ubuntu, Sans-Serif; fill: #60A5FA; }
    .sub { font: 400 11.5px 'Segoe UI', Ubuntu, Sans-Serif; fill: #64748B; }
    .stat-label { font: 600 12.5px 'Segoe UI', Ubuntu, Sans-Serif; fill: #9CA3AF; }
    .stat-val { font: 700 13px 'Segoe UI', Ubuntu, Mono, Sans-Serif; fill: #F8FAFC; }
    .stat-meta { font: 400 11px 'Segoe UI', Ubuntu, Sans-Serif; fill: #38BDF8; }
    .rank-text { font: 800 22px 'Segoe UI', Ubuntu, Sans-Serif; fill: #38BDF8; }
    .rank-sub { font: 700 9.5px 'Segoe UI', Ubuntu, Sans-Serif; fill: #94A3B8; letter-spacing: 1.2px; }
    .rank-caption { font: 500 10.5px 'Segoe UI', Ubuntu, Sans-Serif; fill: #64748B; }
  </style>

  <!-- Card Background -->
  <rect x="1" y="1" width="538" height="218" rx="12" fill="#0D1117" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Header -->
  <text x="24" y="34" class="header">Daniel Vásquez — GitHub Stats (Full Telemetry)</text>
  <text x="24" y="52" class="sub">Actividad real verificada en repositorios públicos y privados (GraphQL)</text>
  <line x1="24" y1="64" x2="516" y2="64" stroke="#1E293B" stroke-width="1"/>

  <!-- Left Column: Stats Rows (Max X = 375) -->
  <!-- Row 1: Total Contributions -->
  <g transform="translate(24, 92)">
    <circle cx="6" cy="-4" r="4" fill="#38BDF8"/>
    <text x="18" y="0" class="stat-label">Contribuciones:</text>
    <text x="132" y="0" class="stat-val">359</text>
    <text x="166" y="0" class="stat-meta">(304 priv · 55 púb)</text>
  </g>

  <!-- Row 2: Total Repositories -->
  <g transform="translate(24, 122)">
    <circle cx="6" cy="-4" r="4" fill="#60A5FA"/>
    <text x="18" y="0" class="stat-label">Repositorios:</text>
    <text x="132" y="0" class="stat-val">27</text>
    <text x="158" y="0" class="stat-meta">(22 priv · 5 púb)</text>
  </g>

  <!-- Row 3: Active Days & Max Peak -->
  <g transform="translate(24, 152)">
    <circle cx="6" cy="-4" r="4" fill="#34D399"/>
    <text x="18" y="0" class="stat-label">Días Activos:</text>
    <text x="132" y="0" class="stat-val">83 días</text>
    <text x="186" y="0" class="stat-meta">(Racha: 11d · Máx: 18/d)</text>
  </g>

  <!-- Row 4: Codebase Volume -->
  <g transform="translate(24, 182)">
    <circle cx="6" cy="-4" r="4" fill="#A78BFA"/>
    <text x="18" y="0" class="stat-label">Volumen Código:</text>
    <text x="132" y="0" class="stat-val">5.81 MB</text>
    <text x="192" y="0" class="stat-meta">(13 repos TypeScript)</text>
  </g>

  <!-- Vertical Divider between Stats and Rank Badge -->
  <line x1="382" y1="78" x2="382" y2="198" stroke="#1E293B" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Right Panel: Rank Ring Perfectly Centered at (460, 128) -->
  <g>
    <!-- Subtle outer glow circle -->
    <circle cx="460" cy="128" r="46" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <!-- Track Ring -->
    <circle cx="460" cy="128" r="38" stroke="#1E293B" stroke-width="6" fill="none"/>
    <!-- Progress Ring (SVG native rotate around exact center 460, 128) -->
    <circle cx="460" cy="128" r="38" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" fill="none" stroke-dasharray="238.76" stroke-dashoffset="32" transform="rotate(-90 460 128)"/>
    <!-- Centered Labels inside Ring -->
    <text x="460" y="126" text-anchor="middle" class="rank-text">A+</text>
    <text x="460" y="143" text-anchor="middle" class="rank-sub">ACTIVE</text>
    <!-- Bottom Caption under Ring -->
    <text x="460" y="194" text-anchor="middle" class="rank-caption">Top Percentile</text>
  </g>
</svg>
